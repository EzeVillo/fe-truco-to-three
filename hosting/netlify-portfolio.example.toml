# Reglas activas en el sitio Netlify que actualmente posee ezevillo.com.
# Conservarlas cuando se publique el portfolio en ese dominio.
# Mantener los dos sitios en el mismo equipo de Netlify.
# Conservar todas las reglas de otros proyectos y colocar estas antes del catch-all.
# El origen del juego conserva /truco-a-3/ en sus archivos y rutas.

[[redirects]]
  from = "/truco-a-3"
  to = "https://ezevillo-truco-a-3.netlify.app/truco-a-3/"
  status = 200
  force = true

[[redirects]]
  from = "/truco-a-3/*"
  to = "https://ezevillo-truco-a-3.netlify.app/truco-a-3/:splat"
  status = 200
  force = true
